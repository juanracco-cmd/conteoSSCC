<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#006363">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Conteo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Conteo de inventario</title>
<style>
:root{
  --teal-deep:#006363; --teal:#00A7A7; --mint:#7DD6C9; --amber:#FEAE01; --blue:#307AFE; --red:#EA3D18; --purple:#A051E5; --grey:#C7C9CA;
  --mint-wash:#E4F5F2; --amber-wash:#FFF2D2; --red-wash:#FDE9E3; --blue-wash:#E6EEFF; --purple-wash:#F2E8FC;
  --amber-ink:#7A4E00; --red-ink:#B02D0E; --blue-ink:#1A55CC; --purple-ink:#7330BC;
  --bg:#F1F5F4; --card:#fff; --line:#DCE2E1; --ink:#162626; --muted:#5A6B6A;
  --font:"Century Gothic","CenturyGothic","Questrial","Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--font)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* Encabezados */
.top{background:var(--teal-deep);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 18px}
.top h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--mint)}
.top .src{font-size:13px;color:#BFE5E0;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpis{display:flex;align-items:flex-end;gap:18px;margin-top:14px}
.kpi b{display:block;font-size:34px;line-height:1;font-weight:700;letter-spacing:-.02em}
.kpi small{font-size:13px;color:#BFE5E0}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.18);margin-top:14px}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--mint)} .bar .b-dif{background:var(--amber)}
.top.locview{padding-bottom:16px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--mint);font-weight:600;padding:6px 8px 6px 0;margin-left:-4px}
.bincode{font-size:clamp(54px,18vw,92px);font-weight:700;letter-spacing:-.03em;line-height:1;margin:6px 0 4px}
.top .sub{color:#BFE5E0;font-size:14px}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;border:2px solid transparent}
.btn.primary{background:var(--teal-deep);color:#fff}
.btn.mint{background:var(--mint);color:#00403F}
.btn.ghost{background:#fff;border-color:var(--line);color:var(--teal-deep)}
.btn.line{border-color:rgba(255,255,255,.5);color:#fff}
.btn.danger{background:var(--red);color:#fff}
.btn.text{min-height:40px;padding:0 8px;color:var(--teal-deep)}
.btn.sm{min-height:40px;padding:0 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.wide{width:100%}

/* Búsqueda y filtros */
.tools{padding:14px 14px 4px}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:0 14px;min-height:52px}
.search:focus-within{border-color:var(--teal)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:16px}
.search svg{color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:20px;background:#fff;border:2px solid var(--line);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.chip em{font-style:normal;opacity:.7;margin-left:4px;font-weight:500}

/* Lista de ubicaciones */
.list{padding:8px 14px;display:flex;flex-direction:column;gap:10px}
.loc{display:flex;align-items:center;gap:14px;background:#fff;border:2px solid transparent;border-radius:16px;padding:12px 14px 12px 12px;text-align:left;width:100%;box-shadow:0 1px 0 var(--line)}
.loc:active{border-color:var(--teal)}
.bin{flex:none;min-width:84px;text-align:center;background:var(--teal-deep);color:#fff;border-radius:10px;padding:10px 8px;font-size:22px;font-weight:700;letter-spacing:-.01em}
.loc.done .bin{background:var(--teal)}
.loc.part .bin{background:#fff;color:var(--teal-deep);box-shadow:inset 0 0 0 2px var(--teal-deep)}
.loc .meta{flex:1;min-width:0}
.loc .meta b{display:block;font-size:15px}
.loc .meta small{color:var(--muted);font-size:13px}
.loc .st{display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-size:13px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:12px;padding:2px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.pend{background:var(--amber-wash);color:var(--amber-ink)}
.pill.ok{background:var(--mint-wash);color:var(--teal-deep)}
.pill.falt{background:var(--red-wash);color:var(--red-ink)}
.pill.sobr{background:var(--blue-wash);color:var(--blue-ink)}
.pill.otra{background:var(--purple-wash);color:var(--purple-ink)}
.pill.nover{background:#EDEFEF;color:var(--muted)}
.addrow{display:flex;justify-content:center;padding:6px 0 0}

/* Materiales */
.items{padding:14px;display:flex;flex-direction:column;gap:12px}
.item{background:#fff;border-radius:16px;border-left:8px solid var(--amber);padding:14px 14px 14px 14px;box-shadow:0 1px 0 var(--line)}
.item.ok{border-left-color:var(--teal)} .item.falt{border-left-color:var(--red)} .item.sobr{border-left-color:var(--blue)}
.item .hd{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.item .mat{font-size:22px;font-weight:700;letter-spacing:-.01em}
.item .sap{font-size:14px;color:var(--muted);white-space:nowrap}
.item .sap b{font-size:20px;color:var(--ink)}
.item .txt{margin:2px 0 12px;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.item .tagx{font-size:12px;font-weight:700;color:var(--purple-ink);background:var(--purple-wash);border-radius:8px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.ctl{display:flex;align-items:center;gap:10px}
.stepper{display:flex;align-items:stretch;border:2px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.stepper button{width:56px;min-height:56px;display:flex;align-items:center;justify-content:center;color:var(--teal-deep);background:var(--mint-wash)}
.stepper button:active{background:var(--mint)}
.stepper input{width:76px;border:0;text-align:center;font-size:26px;font-weight:700;outline:0;-moz-appearance:textfield;background:#fff}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper input::placeholder{color:var(--grey)}
.match{flex:1;min-height:60px}
.match.on{background:var(--teal);color:#fff}
.diffline{margin-top:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Códigos de pallet */
.codes{margin-top:12px;background:#F7FAF9;border:1px dashed var(--grey);border-radius:12px;padding:12px}
.codes h4{margin:0 0 4px;font-size:14px}
.codes .hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.cc{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 8px 8px 12px;margin-bottom:8px}
.cc .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.cc .r{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.cc .pill{white-space:normal;text-align:left;line-height:1.25;padding:3px 10px}
.cc .x{width:40px;height:40px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:10px}
.cc .x:active{background:var(--red-wash);color:var(--red-ink)}
.addcode{display:flex;gap:8px}
.addcode input{flex:1;min-width:0;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:17px;font-variant-numeric:tabular-nums}
.addcode input:focus{border-color:var(--teal);outline:0}
.noteinp{width:100%;margin-top:8px;min-height:44px;border:2px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:15px}
.noteinp:focus{border-color:var(--teal);outline:0}

/* Tarjetas genéricas */
.pad{padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 0 var(--line)}
.card h3{margin:0 0 4px;font-size:17px;color:var(--teal-deep)}
.card p{margin:4px 0 12px;font-size:14px;color:var(--muted)}
.card .row{display:flex;gap:10px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.field select,.field input{min-height:46px;border:2px solid var(--line);border-radius:10px;padding:0 10px;background:#fff;font-size:15px;color:var(--ink);font-weight:500;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.sum{background:var(--mint-wash);border-radius:10px;padding:10px 12px;font-size:14px;color:#00403F;margin:10px 0}
.sum.warn{background:var(--amber-wash);color:var(--amber-ink)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.empty{text-align:center;padding:48px 24px;color:var(--muted)}
.empty h2{color:var(--teal-deep);margin:0 0 8px;font-size:20px}
.empty .btn{margin-top:14px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border:0}.kv b{text-align:right;overflow-wrap:anywhere}
.preview{overflow-x:auto;border:1px solid var(--line);border-radius:10px;margin-top:10px}
.preview table{border-collapse:collapse;font-size:12px;width:100%}
.preview td,.preview th{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.preview th{background:var(--mint-wash);color:var(--teal-deep)}

/* Diferencias */
.drow{display:block;width:100%;text-align:left;background:#fff;border-radius:14px;padding:12px 14px;border-left:8px solid var(--red);box-shadow:0 1px 0 var(--line)}
.drow.sobr{border-left-color:var(--blue)}
.drow .l1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.drow .l1 b{font-size:18px}
.drow .l2{font-size:13px;color:var(--muted);margin:2px 0 8px;overflow-wrap:anywhere}
.drow .l3{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px}
.sumrow{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sumrow div{background:#fff;border-radius:14px;padding:12px;text-align:center}
.sumrow b{display:block;font-size:26px;line-height:1.1}
.sumrow small{color:var(--muted);font-size:12px}

/* Barra inferior */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:20}
.tabbar .in{display:flex;width:100%;max-width:760px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 8px;font-size:12px;font-weight:600;color:var(--muted);min-height:64px}
.tab span.ic{display:flex;align-items:center;justify-content:center;width:56px;height:30px;border-radius:15px;position:relative}
.tab.on{color:var(--teal-deep)}
.tab.on span.ic{background:var(--mint)}
.tab .badge{position:absolute;top:-4px;right:2px;background:var(--red);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;line-height:18px}

/* Capas */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#14302F;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;z-index:60;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
#toast.err{background:var(--red)}
.scrim{position:fixed;inset:0;background:rgba(10,30,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.dlg,.sheet{background:#fff;width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom))}
.dlg h3,.sheet h3{margin:0 0 6px;color:var(--teal-deep)}
.dlg p{margin:0 0 16px;color:var(--muted);font-size:15px}
.dlg .row{display:flex;gap:10px}.dlg .row .btn{flex:1}
.sheet{max-height:86vh;display:flex;flex-direction:column}
.sheet .res{overflow-y:auto;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.opt:active{border-color:var(--teal)}
.opt b{font-size:17px}.opt small{display:block;color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.opt .pill{margin-top:4px}
.scanbox{position:fixed;inset:0;background:#000;z-index:70;display:flex;flex-direction:column}
.scanbox video{flex:1;width:100%;object-fit:cover}
.scanbox .frame{position:absolute;left:8%;right:8%;top:30%;height:24%;border:3px solid var(--mint);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45)}
.scanbox .cap{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 14px);text-align:center;color:#fff;font-weight:600;padding:0 20px}
.scanbox .btn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(28px + env(safe-area-inset-bottom))}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar"><div class="in" id="tabs"></div></nav>
<div id="toast" role="status" aria-live="polite"></div>
<div id="layer"></div>

<script>
// <core>
/* =============== Núcleo sin DOM: lectura/escritura de Excel, detección de columnas =============== */
const _td = new TextDecoder();
async function inflateRaw(u8){
  if(typeof DecompressionStream==='undefined') throw new Error('Este navegador no puede abrir .xlsx. Actualizá Chrome o Safari.');
  const s=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(s).arrayBuffer());
}
async function unzip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf);
  let e=u8.length-22; while(e>=0 && dv.getUint32(e,true)!==0x06054b50) e--;
  if(e<0) throw new Error('El archivo no es un .xlsx válido.');
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const files={};
  for(let i=0;i<n;i++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true), csize=dv.getUint32(p+20,true);
    const nl=dv.getUint16(p+28,true), xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), off=dv.getUint32(p+42,true);
    files[_td.decode(u8.subarray(p+46,p+46+nl))]={method,csize,off};
    p+=46+nl+xl+cl;
  }
  return {
    has:n=>!!files[n],
    async read(name){
      const f=files[name]; if(!f) return null;
      const nl=dv.getUint16(f.off+26,true), xl=dv.getUint16(f.off+28,true), st=f.off+30+nl+xl;
      const data=u8.subarray(st,st+f.csize);
      return _td.decode(f.method===0?data:await inflateRaw(data));
    }
  };
}
const _ent={'&amp;':'&','&lt;':'<','&gt;':'>','&quot;':'"','&apos;':"'"};
function xd(s){return s.replace(/&(amp|lt|gt|quot|apos);|&#(\d+);|&#x([0-9a-f]+);/gi,(m,a,d,h)=>a?_ent['&'+a.toLowerCase()+';']:String.fromCodePoint(d?+d:parseInt(h,16)));}
function xattr(s,n){const m=new RegExp('(?:^|\\s)'+n+'="([^"]*)"').exec(s);return m?xd(m[1]):null;}
function colIdx(ref){const m=/^([A-Z]+)/.exec(ref);let n=0;for(const ch of m[1])n=n*26+ch.charCodeAt(0)-64;return n-1;}
function colName(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

async function readXlsx(buf){
  const z=await unzip(buf);
  const wb=await z.read('xl/workbook.xml'); if(!wb) throw new Error('El archivo no es un .xlsx válido.');
  const rels=await z.read('xl/_rels/workbook.xml.rels')||'';
  const relMap={}; for(const m of rels.matchAll(/<Relationship\b([^>]*?)\/?>/g)){const id=xattr(m[1],'Id'),t=xattr(m[1],'Target'); if(id&&t) relMap[id]=t.startsWith('/')?t.slice(1):'xl/'+t.replace(/^\.\//,'');}
  const sst=[]; const ss=await z.read('xl/sharedStrings.xml');
  if(ss) for(const m of ss.matchAll(/<si\b[^>]*>([\s\S]*?)<\/si>/g)){
    const body=m[1].replace(/<rPh\b[\s\S]*?<\/rPh>/g,'');
    let t=''; for(const x of body.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)) t+=xd(x[1]);
    sst.push(t);
  }
  const sheets=[];
  for(const m of wb.matchAll(/<sheet\b([^>]*?)\/?>/g)){
    const name=xattr(m[1],'name'), rid=xattr(m[1],'r:id'); const path=relMap[rid];
    if(!path||!z.has(path)) continue;
    const xml=await z.read(path); const rows=[];
    for(const rm of xml.matchAll(/<row\b[^>]*?(?:\/>|>([\s\S]*?)<\/row>)/g)){
      const body=rm[1]; if(!body) continue;
      const row=[]; let max=-1;
      for(const cm of body.matchAll(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g)){
        const at=cm[1], inner=cm[2]; if(!inner) continue;
        const ref=xattr(at,'r'); if(!ref) continue; const ci=colIdx(ref); const t=xattr(at,'t');
        let val='';
        if(t==='inlineStr'){ for(const x of inner.matchAll(/<t\b[^>]*>([\s\S]*?)<\/t>/g)) val+=xd(x[1]); }
        else { const v=/<v>([\s\S]*?)<\/v>/.exec(inner); if(!v) continue; const raw=xd(v[1]);
          val = t==='s' ? (sst[+raw]??'') : t==='e' ? '' : t==='b' ? (raw==='1'?'VERDADERO':'FALSO') : raw; }
        row[ci]=String(val).trim(); if(ci>max) max=ci;
      }
      const ri=+(xattr(rm[0].slice(0,rm[0].indexOf('>')+1),'r')||rows.length+1)-1;
      for(let i=0;i<=max;i++) if(row[i]===undefined) row[i]='';
      while(rows.length<ri) rows.push([]);
      rows[ri]=row;
    }
    sheets.push({name,rows});
  }
  if(!sheets.length) throw new Error('No encontré hojas en el archivo.');
  return sheets;
}
function parseCsv(text){
  const first=text.split(/\r?\n/,1)[0]||''; const cnt=c=>first.split(c).length-1;
  const d=[['\t',cnt('\t')],[';',cnt(';')],[',',cnt(',')],['|',cnt('|')]].sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[]; let row=[],cur='',q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===d){row.push(cur.trim());cur='';}
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur.trim());cur=''; if(row.some(x=>x!=='')) rows.push(row); row=[]; }
    else cur+=ch;
  }
  row.push(cur.trim()); if(row.some(x=>x!=='')) rows.push(row);
  return rows;
}
async function readAny(file){
  const buf=await file.arrayBuffer(); const ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='xls') throw new Error('Los .xls antiguos no se pueden leer. Guardalo como .xlsx desde Excel e intentá de nuevo.');
  if(ext==='csv'||ext==='txt'||ext==='tsv'){
    let t=new TextDecoder('utf-8').decode(buf); if(t.includes('\uFFFD')) t=new TextDecoder('windows-1252').decode(buf);

const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
function detectMap(hdr){
  const h=hdr.map(norm);
  const find=res=>{for(const re of res){const i=h.findIndex(x=>re.test(x));if(i>=0)return i;}return -1;};
  return {
    ubic:find([/^(ubicacion|ubicaciondealmacen|bin|ubic|posicion)$/]),
    mat:find([/^(material|codigodematerial|codmaterial|codigomaterial|nmaterial|numerodematerial)$/]),
    txt:find([/textobreve/,/descripcion/,/^texto/]),
    qty:find([/stockdisponiblepal$/,/^pal$/,/^sap$/,/^cantidad/,/^stockdisponible$/]),
    sscc:find([/^sscc$/,/^unidadalmacen$/,/^unidaddealmacen$/,/^ua$/,/^nue$/]),
    lote:find([/^lote$/]),
    fecha:find([/^fechaem$/,/^fecha/])

function findHeader(rows){
  for(let i=0;i<Math.min(30,rows.length);i++){
    const r=rows[i]; if(!r||!r.length) continue; const map=detectMap(r);

}
const onlyDigits=s=>String(s||'').replace(/\D/g,'');

function buildDataset(rows,hdr,map){
  const items=new Map(), pallets=[]; let rowsUsed=0;
  const cell=(r,i)=>i>=0&&r[i]!==undefined?String(r[i]).trim():'';
  for(let i=hdr+1;i<rows.length;i++){
    const r=rows[i]; if(!r||!r.length) continue;
    const u=cell(r,map.ubic), m=cell(r,map.mat); if(!u||!m) continue;
    let q=map.qty>=0?toNum(r[map.qty]):1; if(!isFinite(q)) q=0;
    const id=u+'|'+m; let it=items.get(id);
    if(!it){it={id,ubic:u,mat:m,txt:cell(r,map.txt),sap:0,cnt:null,note:'',codes:[]};items.set(id,it);}
    if(!it.txt) it.txt=cell(r,map.txt);
    it.sap=Math.round((it.sap+q)*1000)/1000; rowsUsed++;
    if(map.sscc>=0){ const s=onlyDigits(cell(r,map.sscc)); if(s.length===18) pallets.push([s,u,m,cell(r,map.lote),xlDate(cell(r,map.fecha))]); }
  }
  const list=[...items.values()];

}
function analyzeSheets(sheets){
  return sheets.map(s=>{
    const h=findHeader(s.rows); let palletsOk=0;
    if(h&&h.map.sscc>=0){ for(let i=h.hdr+1;i<Math.min(s.rows.length,h.hdr+60);i++){ if(onlyDigits((s.rows[i]||[])[h.map.sscc]).length===18) palletsOk++; } }
    return {name:s.name,rows:s.rows,hdr:h?h.hdr:0,map:h?h.map:{ubic:-1,mat:-1,txt:-1,qty:-1,sscc:-1,lote:-1,fecha:-1},valid:!!h,palletsOk,n:s.rows.length};
  });
}
function bestSheet(an){
  let best=-1,score=-1;
  an.forEach((s,i)=>{ if(!s.valid) return; const sc=(s.palletsOk?1000:0)+(s.map.qty>=0?100:0)+(s.map.txt>=0?10:0)+Math.min(s.n,9999)/10000; if(sc>score){score=sc;best=i;} });
  return best;
}

const _crcT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();

  for(const [name,content] of files){
    const nb=enc.encode(name), data=enc.encode(content), crc=crc32(data);
    const lh=new Uint8Array(30+nb.length), v=new DataView(lh.buffer);
    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(8,0,true);v.setUint16(10,dt,true);v.setUint16(12,dd,true);
    v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,nb.length,true);v.setUint16(28,0,true);lh.set(nb,30);

    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,nb.length,true);c.setUint32(42,off,true);ch.set(nb,46);

  }
  const cdSize=cd.reduce((a,b)=>a+b.length,0), end=new Uint8Array(22), e=new DataView(end.buffer);

function sheetXml(sh){
  const ncol=Math.max(...sh.rows.map(r=>r.length)), nrow=sh.rows.length;

function buildXlsx(sheets){

    ['xl/workbook.xml',`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s,i)=>`<sheet name="${xe(s.name)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')}</sheets></workbook>`],

/* =============== Acciones =============== */
function setCnt(id,v){const it=getItem(id);if(!it)return;it.cnt=v;save();render();}
async function onClick(e){
  const a=e.target.closest('[data-act]'); if(!a) return; const act=a.dataset.act, id=a.dataset.id;
  switch(act){
    case 'tab': V.tab=a.dataset.t; V.loc=null; render(); window.scrollTo(0,0); break;
    case 'openloc': V.loc=a.dataset.u; render(); window.scrollTo(0,0); break;
    case 'back': V.loc=null; render(); window.scrollTo(0,0); break;
    case 'filter': V.filter=a.dataset.f; renderList(); break;
    case 'plus': {const it=getItem(id);setCnt(id,it.cnt==null?it.sap+1:it.cnt+1);break;}
    case 'minus': {const it=getItem(id);setCnt(id,Math.max(0,it.cnt==null?it.sap-1:it.cnt-1));break;}
    case 'match': {const it=getItem(id);setCnt(id,(it.cnt===it.sap)?null:it.sap);break;}
    case 'locall': {let n=0;for(const it of S.items) if(it.ubic===V.loc&&it.cnt==null&&it.sap>0){it.cnt=it.sap;n++;} save();render();toast(n+' materiales marcados como coincidentes');break;}
    case 'addcode': addCode(id,$('#code-'+CSS.escape(id)).value); break;
    case 'rmcode': {const it=getItem(id);it.codes.splice(+a.dataset.i,1);save();render();break;}
    case 'gotoitem': V.tab='home';V.loc=a.dataset.u;render();{const el=document.getElementById('it-'+id);if(el)el.scrollIntoView({block:'start'});}break;
    case 'addloc': addLoc(); break;
    case 'addmat': openAddMat(); break;
    case 'scan': scan(id); break;
    case 'palq': palQuery($('#pq').value); break;
    case 'xlsx': saveBlob(makeResults(),fname('xlsx')); break;
    case 'xlsx-share': shareBlob(makeResults(),fname('xlsx')); break;
    case 'json': saveBlob(makeCopy(),fname('json')); break;
    case 'json-share': shareBlob(makeCopy(),fname('json')); break;
    case 'applyimp': applyImport(); break;
    case 'cancelimp': IMP=null; $('#impcard').innerHTML=''; break;
    case 'clearcnt': if(await ask({title:'Borrar conteos',text:'Se borran las cantidades contadas y los códigos de pallet. Los datos de SAP se mantienen.',ok:'Borrar conteos',danger:true})){for(const it of S.items){it.cnt=null;it.codes=[];it.note='';} S.items=S.items.filter(i=>!i.extra);save();render();toast('Conteos borrados');} break;
    case 'clearall': if(await ask({title:'Borrar todo',text:'Se borran los datos de SAP y todos los conteos de este dispositivo. Esto no se puede deshacer.',ok:'Borrar todo',danger:true})){S=blankState();P=[];buildIndex();await dbSet('pallets',[]);await flush();V={tab:'home',loc:null,filter:'all',q:''};render();toast('Datos borrados');} break;
  }
}
function addCode(id,raw){
  const it=getItem(id), d=normCode(raw);
  if(!d){toast('Ingresá un código','err');return;}
  if(d.length!==7&&d.length!==18){toast(`El código tiene ${d.length} dígitos. Debe tener 7 (verificación) o 18 (SSCC)`,'err');return;}
  const p=lookup(d), key=p?p.s:d, owner=findCodeOwner(key);
  if(owner){toast(`Ese pallet ya está registrado en ${owner.ubic} · ${owner.mat}`,'err');return;}
  it.codes.push({c:d,s:p?p.s:null,t:Date.now()}); save();
  focusNext='#code-'+CSS.escape(id); render();
  const r=classify(it.codes[it.codes.length-1],it);
  toast(r.k==='nover'?'Código agregado':r.t, r.k==='nosap'||r.k==='otra'||r.k==='otromat'?'':'');
}
async function addLoc(){

    }
    if(n.length>=2){
      let c=0; for(const [m,t] of CAT){ if(norm(m+t).includes(n)){ h+=`<button class="opt" data-add="${esc(m)}"><b>${esc(m)}</b><small>${esc(t)}</small></button>`; if(++c>=30)break; } }
      if(/^\d{7}$/.test(q)&&!CAT.has(q)) h+=`<button class="opt" data-add="${esc(q)}"><b>Agregar material ${esc(q)}</b><small>No está en la lista de SAP; queda sin texto.</small></button>`;
    }
    $('#amres').innerHTML=h||'<p style="color:var(--muted);font-size:14px;margin:4px 0">Escribí el código de verificación de la etiqueta, el código de material o parte del texto.</p>';
  };
  l.oninput=e=>{if(e.target.id==='am')draw();};
  l.onclick=e=>{const o=e.target.closest('[data-add]');if(o){add(o.dataset.add,o.dataset.code||null);return;}const b=e.target.closest('[data-r]');if(b||e.target.classList.contains('scrim'))close();};
  draw(); setTimeout(()=>{const i=$('#am');if(i)i.focus();},50);
}
function palQuery(raw){
  const d=normCode(raw), box=$('#pres');
  if(d.length!==7&&d.length!==18){box.innerHTML=`<div class="sum warn">El código tiene ${d.length} dígitos. Debe tener 7 o 18.</div>`;return;}
  box.innerHTML=palCard(d);
}

/* =============== Escáner de etiquetas (si el navegador lo soporta) =============== */
async function scan(target){
  if(!('BarcodeDetector' in window)){toast('Este navegador no puede escanear. Ingresá el código a mano.','err');return;}
  let stream=null,timer=null;
  const box=document.createElement('div');box.className='scanbox';
  box.innerHTML=`<video playsinline muted></video><div class="frame"></div><div class="cap">Apuntá al código de barras del SSCC</div><button class="btn mint">Cerrar</button>`;
  document.body.appendChild(box);
  const stop=()=>{clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());box.remove();};
  box.querySelector('button').onclick=stop;
  try{
    const det=new BarcodeDetector({formats:['code_128','data_matrix','qr_code']});
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    const v=box.querySelector('video');v.srcObject=stream;await v.play();
    timer=setInterval(async()=>{
      try{
        const found=await det.detect(v);
        for(const f of found){const s=extractSscc(f.rawValue||'');if(s){stop();onScanned(target,s);return;}}
      }catch(_){}
    },250);
  }catch(err){stop();toast('No pude abrir la cámara. Revisá el permiso o ingresá el código a mano.','err');}
}
function onScanned(target,sscc){
  if(target==='__q'){$('#pq').value=sscc;palQuery(sscc);}
  else if(target==='__am'){const i=$('#am');if(i){i.value=sscc;i.dispatchEvent(new Event('input',{bubbles:true}));}}
  else addCode(target,sscc);
}

/* =============== Entrada de datos (inputs) =============== */
function onChange(e){
  const t=e.target;
  if(t.dataset.input==='cnt'){const it=getItem(t.dataset.id);const v=t.value.trim();if(v===''){setCnt(it.id,null);return;}const n=toNum(v);if(!isFinite(n)||n<0){toast('Ingresá una cantidad válida','err');render();return;}setCnt(it.id,n);}
  else if(t.dataset.input==='note'){getItem(t.dataset.id).note=t.value.trim();save();}
  else if(t.id==='contador'){S.contador=t.value.trim();save();}
  else if(t.id==='m-sheet'&&IMP){IMP.cur=+t.value;renderImport();}
  else if(t.dataset.map&&IMP){IMP.an[IMP.cur].map[t.dataset.map]=+t.value;renderImport();}
  else if(t.id==='f-sap') loadSap(t.files[0],t);
  else if(t.id==='f-json') loadCopy(t.files[0],t);
}
function onInput(e){ if(e.target.id==='q'){V.q=e.target.value;renderList();} }
function onKey(e){
  if(e.key!=='Enter') return; const t=e.target;
  if(t.dataset.input==='code'){e.preventDefault();addCode(t.dataset.id,t.value);}
  else if(t.id==='pq'){e.preventDefault();palQuery(t.value);}
}

/* =============== Archivos =============== */
async function loadSap(file,input){
  if(!file) return;
  try{
    toast('Leyendo archivo…');
    const sheets=await readAny(file), an=analyzeSheets(sheets), best=bestSheet(an);
    if(best<0){input.value='';toast('No encontré columnas de ubicación y material en ninguna hoja.','err');return;}
    IMP={name:file.name,an,cur:best,ds:null};
    $('#toast').className='';
    render(); $('#impcard').scrollIntoView({behavior:'smooth',block:'start'});
  }catch(err){toast(err.message||'No pude leer el archivo','err');}
  input.value='';
}
async function applyImport(){
  if(!IMP||!IMP.ds) return;
  if(stats().done>0 && !(await ask({title:'Reemplazar datos',text:'Ya hay conteos guardados. Si cargás otro archivo se pierden. Descargá antes el Excel de resultados si los necesitás.',ok:'Reemplazar',danger:true}))) return;
  const s=IMP.an[IMP.cur], ds=IMP.ds;
  const unit=s.map.qty>=0&&!/pal/i.test(s.rows[s.hdr][s.map.qty])?'u':'pal';
  S={...blankState(),src:IMP.name,loadedAt:Date.now(),unit,contador:S.contador,items:ds.items};
  P=ds.pallets; buildIndex(); IMP=null;
  await dbSet('pallets',P); await flush();
  V={tab:'home',loc:null,filter:'all',q:''}; render(); window.scrollTo(0,0);
  toast(`${S.items.length} materiales cargados`);
}
function fname(ext){const d=new Date(),p=n=>String(n).padStart(2,'0');return `Conteo_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}.${ext}`;}
function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast('Descargando '+name);}
async function shareBlob(blob,name){
  const f=new File([blob],name,{type:blob.type});
  try{ if(navigator.canShare&&navigator.canShare({files:[f]})) await navigator.share({files:[f],title:name}); else saveBlob(blob,name); }
  catch(e){ if(e&&e.name!=='AbortError') saveBlob(blob,name); }
}
function makeCopy(){return new Blob([JSON.stringify({app:'conteo-inventario',v:1,exportedAt:Date.now(),state:S,pallets:P})],{type:'application/json'});}
async function loadCopy(file,input){
  if(!file) return;
  try{
    const j=JSON.parse(await file.text());
    if(j.app!=='conteo-inventario'||!j.state||!Array.isArray(j.state.items)) throw new Error('Este archivo no es una copia de la app.');
    if(S.items.length&&!(await ask({title:'Reemplazar datos',text:'Se reemplazan los datos y conteos de este dispositivo por los de la copia.',ok:'Reemplazar',danger:true}))){input.value='';return;}
    S={...blankState(),...j.state}; P=Array.isArray(j.pallets)?j.pallets:[]; buildIndex();
    await dbSet('pallets',P); await flush(); V={tab:'home',loc:null,filter:'all',q:''}; render(); toast('Copia importada');
  }catch(err){toast(err.message||'No pude leer la copia','err');}
  input.value='';
}
function makeResults(){
  const items=[...S.items].sort((a,b)=>natural(a.ubic,b.ubic)||natural(a.mat,b.mat)), U=S.unit;
  const label=it=>{const st=stOf(it);return it.extra?'Material no listado':st==='pend'?'Sin contar':st==='ok'?'Coincide':st==='falt'?'Faltante':'Sobrante';};
  const sty=it=>({pend:5,ok:4,falt:2,sobr:3})[stOf(it)];
  const resumen=[['Ubicación','Material','Texto breve de material','SAP ('+U+')','Conteo','Diferencia','Estado','Códigos de pallet','Comentarios']];
  items.forEach((it,i)=>{const r=i+2;resumen.push([it.ubic,it.mat,it.txt,it.sap,it.cnt==null?null:it.cnt,it.cnt==null?null:{f:`E${r}-D${r}`,v:dif(it),s:sty(it)},{v:label(it),s:sty(it)},it.codes.map(shortCode).join(', '),it.note]);});
  const dl=items.filter(i=>dif(i));
  const difs=[['Ubicación','Material','Texto breve de material','SAP ('+U+')','Conteo','Diferencia','Tipo','Códigos de pallet','Resultado contra SAP','Comentarios']];
  dl.forEach((it,i)=>{const r=i+2,d=dif(it);const cl=it.codes.map(c=>classify(c,it));
    difs.push([it.ubic,it.mat,it.txt,it.sap,it.cnt,{f:`E${r}-D${r}`,v:d,s:sty(it)},{v:d<0?'Faltante':'Sobrante',s:sty(it)},it.codes.map(shortCode).join(', '),
      cl.map(c=>c.res||c.t).join('; ')+(d>0&&it.codes.length<d?(cl.length?'; ':'')+`faltan ${fmt(d-it.codes.length)} código(s)`:''),it.note]);});
  const pal=[['Ubicación contada','Material contado','Código ingresado','SSCC','Resultado contra SAP','Ubicación en SAP','Material en SAP','Lote','Fecha EM','Registrado','Comentarios']];
  for(const it of items) for(const c of it.codes){const r=classify(c,it),p=r.p;
    pal.push([it.ubic,it.mat,shortCode(c),c.s||(c.c.length===18?c.c:''),r.res||r.t,p?p.u:'',p?p.m:'',p?p.l:'',p?p.f:'',new Date(c.t).toLocaleString('es-AR'),it.note]);}
  const st=stats(), now=new Date().toLocaleString('es-AR');
  const info=[['Dato','Valor'],['Archivo de SAP',S.src],['Cargado',new Date(S.loadedAt).toLocaleString('es-AR')],['Exportado',now],['Contador',S.contador],['Materiales por ubicación',st.tot],['Contados',st.done],['Coinciden',st.ok],['Con diferencia',st.dif],['Sin contar',st.pend],['Pallets en la base de SAP',P.length],['Unidad','pal = pallets, u = unidades']];
  const W=(...w)=>w;
  return buildXlsx([
    {name:'Resumen',rows:resumen,freeze:1,filter:1,widths:W(11,11,46,11,10,11,20,26,36)},
    {name:'Diferencias',rows:difs,freeze:1,filter:1,widths:W(11,11,46,11,10,11,11,26,60,36)},
    {name:'Pallets',rows:pal,freeze:1,filter:1,widths:W(12,12,14,22,40,14,12,12,12,20,30)},
    {name:'Info',rows:info,freeze:1,widths:W(30,44)}
  ]);
}

/* =============== Inicio =============== */
async function init(){
  document.addEventListener('click',onClick);
  document.addEventListener('change',onChange);
  document.addEventListener('input',onInput);
  document.addEventListener('keydown',onKey);
  try{
    const s=await dbGet('state'); const p=await dbGet('pallets');
    if(s&&Array.isArray(s.items)) S={...blankState(),...s};
    if(Array.isArray(p)) P=p; buildIndex();
  }catch(e){}
  render();
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{if(V.tab==='file')render();}).catch(()=>{});
}
if(typeof document!=='undefined'&&document.getElementById('app')) init();
</script>
